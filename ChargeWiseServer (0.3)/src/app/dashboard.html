<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard de Consumo de Energia</title>
    <link rel="stylesheet" href="/dashboard/styles.css">

</head>
<body>
    <nav class="container-fluid">
        <ul>
            <strong>DASHBOARD</strong>
        </ul>
        <ul>
            <button id="logout">Sair</button>
            <button id="setup">Configurações</button>
            <button id="mqttSend">Tomada (OFF)</button>
        </ul>
    </nav>
    <main class="container">
        <div class="grid">
            <section>
                <h2>Potência Total Consumida</h2>
                <canvas id="totalPowerChart"></canvas>
            </section>
            <section>
                <h2>Potência Consumida pelos Veículos</h2>
                <canvas id="vehiclePowerChart"></canvas>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/dashboard/script.js"></script>
</body>
</html>
